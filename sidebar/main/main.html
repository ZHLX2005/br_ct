<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Assistant - 多端 AI 调度工具</title>
    <link rel="stylesheet" href="../../popup/main/prompts/promptsUI.css" />
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell" data-mode="aichat">

      <header class="app-header">
        <div class="app-header-left">
          <span class="app-header-title">AI Assistant</span>
        </div>
        <button class="cc-toggle" id="cc-toggle" title="切换到 Claude Code 模式">
          <svg class="cc-toggle-icon cc-toggle-icon-cc" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
          </svg>
          <svg class="cc-toggle-icon cc-toggle-icon-chat" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="cc-toggle-label cc-toggle-label-cc">Claude Code</span>
          <span class="cc-toggle-label cc-toggle-label-chat">AI Chat</span>
        </button>
      </header>

      <div id="app-view" class="app-view"></div>

      <!-- 隐藏的提示词选择器（aichat JS 需要） -->
      <div class="prompt-optimizer-selector" id="prompt-optimizer-select" style="display:none">
        <div class="custom-select">
          <div class="selected-value" data-value="" data-template="">不使用优化</div>
          <div class="custom-select-options"></div>
        </div>
      </div>

    </div>

    <script src="../../runjs/translation/lib/marked.min.js"></script>
    <script src="../_boot_diag.js"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
