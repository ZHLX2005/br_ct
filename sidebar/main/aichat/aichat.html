<div class="aichat-top-bar" id="aichat-top-bar">
  <button class="toolbar-platform-btn" id="platform-selector-btn">
    <span class="toolbar-platform-label">AI 平台</span>
    <span class="toolbar-platform-count" id="platform-count">0</span>
    <svg class="toolbar-chevron" id="selector-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="workspace-tabs-wrap">
    <div class="workspace-tabs" id="workspace-tabs">
      <!-- 工作区标签由 JS 动态渲染 -->
    </div>
    <button class="workspace-tab-add" id="workspace-tab-add" title="添加当前页面到工作区">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="toolbar-actions">
    <button class="toolbar-action-btn" id="toolbar-extract" title="提取页面文本">提取</button>
    <button class="toolbar-action-btn" id="toolbar-select-all">全选</button>
    <button class="toolbar-action-btn" id="toolbar-clear-chat" title="清空聊天内容">清空</button>
    <button class="toolbar-action-btn toolbar-action-close" id="toolbar-close-ai">关闭AI</button>
    <button class="toolbar-action-btn toolbar-settings-btn" id="toolbar-settings" title="设置">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</div>

<div class="aichat-settings-modal" id="aichat-settings-modal" style="display:none">
  <div class="aichat-settings-backdrop"></div>
  <div class="aichat-settings-panel">
    <div class="aichat-settings-header">
      <span class="aichat-settings-title">AI Chat 设置</span>
      <button class="aichat-settings-close" id="aichat-settings-close" type="button">×</button>
    </div>
    <div class="aichat-settings-body">
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-capture-on-send">
        <span>发送消息时自动捕获当前页面</span>
      </label>
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-add-tab-on-send">
        <span>发送消息时自动添加当前标签页到工作区</span>
      </label>
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-block-on-send">
        <span>问题阻塞（统一发送）</span>
      </label>
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-selection-mode">
        <span>划词选择模式</span>
      </label>
      <label class="aichat-settings-item aichat-settings-item--desc">
        <input type="checkbox" id="setting-selection-ask">
        <span class="aichat-settings-text">
          <span>启用划词快捷提问</span>
          <span class="aichat-settings-hint">在 AI 平台页面划词时显示快捷提示词模板</span>
        </span>
      </label>
    </div>
  </div>
</div>

<div class="tab-context-menu" id="tab-context-menu" style="display:none">
  <div class="context-menu-item" data-action="close">关闭标签页</div>
  <div class="context-menu-item danger" data-action="remove">移除工作区</div>
</div>

<div class="platform-pills" id="platform-pills"></div>

<div class="platform-panel" id="platform-panel">
  <div class="platform-options-row" id="platform-options-row"></div>
</div>

<div class="prompt-bar" id="prompt-bar">
  <span class="prompt-bar-label">提示词:</span>
  <span class="prompt-bar-name" id="prompt-bar-name"></span>
  <span class="prompt-bar-alias" id="prompt-bar-alias"></span>
  <button class="prompt-bar-clear" id="prompt-bar-clear" title="清除提示词">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="main-pages">
  <section class="page active" id="page-main">
    <div class="response-content" id="response-content">
      <div class="history-section" id="history-section"></div>
      <div class="source-panel" id="source-panel" style="display:none">
        <div class="source-panel-header">
          <span class="source-panel-title">有来源的消息</span>
          <button class="source-panel-close" id="source-panel-close" type="button" title="关闭">×</button>
        </div>
        <div class="source-panel-body" id="source-panel-body">
          <div class="source-empty-tip">暂无带来源的消息</div>
        </div>
      </div>
      <div class="conversation-section" id="conversation-section">
        <div class="response-placeholder">暂无回复内容</div>
      </div>
    </div>
    <div class="response-status" id="response-status">
      <span class="status-indicator"></span>
      <span class="status-text">等待回复...</span>
    </div>
  </section>
</div>

<div class="input-area">
  <div class="extract-result" id="extract-result" style="display: none;">
    <div class="extract-result-header">
      <span class="extract-title" id="extract-title"></span>
      <button class="close-result" id="close-result" type="button">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="extract-url" id="extract-url"></div>
    <pre class="extract-content" id="extract-content"></pre>
  </div>

  <div class="chat-input-bar" id="chat-input-bar">
    <div class="pending-send-bar" id="pending-send-bar" style="display:none">
      <span class="pending-send-count" id="pending-send-count">0 条消息待发送</span>
      <button class="pending-send-btn" id="pending-send-btn">双链复制</button>
    </div>
    <div class="chat-input-inner">
      <textarea class="chat-input" id="chat-input" placeholder="输入消息，输入 / 选择提示词模板..." rows="2"></textarea>
    </div>
    <div class="chat-input-foot" id="chat-input-foot">
      <div class="chat-input-foot-left">
        <button class="foot-btn" id="foot-history-btn" title="查看历史消息">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.5v3l2 1.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          历史
        </button>
        <button class="foot-btn" id="foot-source-btn" title="查看来源消息">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          来源
        </button>
      </div>
      <div class="chat-input-foot-right">
        <button class="mode-toggle" id="mode-toggle" title="切换直发/复制模式">直发</button>
        <button class="send-btn" id="chat-btn-send" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 8l12-6-6 12-2-4-4-2z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
