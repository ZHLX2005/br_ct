<div class="aichat-top-bar" id="aichat-top-bar">
  <button class="toolbar-platform-btn" id="platform-selector-btn">
    <span class="toolbar-platform-label">AI 平台</span>
    <span class="toolbar-platform-count" id="platform-count">0</span>
    <svg class="toolbar-chevron" id="selector-chevron" width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M2 3.5l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="toolbar-actions">
    <button class="toolbar-action-btn" id="toolbar-extract" title="提取页面文本">提取</button>
    <button class="toolbar-action-btn" id="toolbar-clear-chat" title="清空聊天内容">清空</button>
    <button class="toolbar-action-btn toolbar-action-close" id="toolbar-close-ai">关闭AI</button>
    <button class="toolbar-action-btn toolbar-settings-btn" id="toolbar-settings" title="设置">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</div>

<div class="aichat-settings-modal" id="aichat-settings-modal" style="display:none">
  <div class="aichat-settings-backdrop"></div>
  <div class="aichat-settings-panel">
    <div class="aichat-settings-header">
      <span class="aichat-settings-title">AI Chat 设置</span>
      <button class="aichat-settings-close" id="aichat-settings-close" type="button">×</button>
    </div>
    <div class="aichat-settings-body">
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-capture-on-send">
        <span>发送消息时自动捕获当前页面</span>
      </label>
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-add-tab-on-send">
        <span>发送消息时自动添加当前标签页到工作区</span>
      </label>
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-block-on-send">
        <span>问题阻塞（统一发送）</span>
      </label>
      <label class="aichat-settings-item">
        <input type="checkbox" id="setting-selection-mode">
        <span>划词选择模式</span>
      </label>
      <label class="aichat-settings-item aichat-settings-item--desc">
        <input type="checkbox" id="setting-selection-ask">
        <span class="aichat-settings-text">
          <span>启用划词快捷提问</span>
          <span class="aichat-settings-hint">在 AI 平台页面划词时显示快捷提示词模板</span>
        </span>
      </label>
      <div class="aichat-settings-item aichat-settings-item--shortcut">
        <div class="shortcut-header">
          <label class="aichat-settings-label">Tab 切换快捷键</label>
          <label class="switch-toggle">
            <input type="checkbox" id="setting-sidebar-tab-switch-enabled" checked>
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="shortcut-input-wrapper">
          <input
            type="text"
            id="setting-sidebar-tab-switch-shortcut"
            class="shortcut-input"
            placeholder="默认: `"
            readonly
          >
          <button id="clear-sidebar-tab-switch-shortcut" class="shortcut-clear-btn" title="清除">×</button>
        </div>
        <small class="aichat-settings-hint">在工作区和 AI 平台之间切换</small>
      </div>
      <div class="aichat-settings-item aichat-settings-item--shortcut">
        <div class="shortcut-header">
          <label class="aichat-settings-label">添加工作区快捷键</label>
          <label class="switch-toggle">
            <input type="checkbox" id="setting-add-workspace-enabled" checked>
            <span class="switch-slider"></span>
          </label>
        </div>
        <div class="shortcut-input-wrapper">
          <input
            type="text"
            id="setting-add-workspace-shortcut"
            class="shortcut-input"
            placeholder="默认: Alt+W"
            readonly
          >
          <button id="clear-add-workspace-shortcut" class="shortcut-clear-btn" title="清除">×</button>
        </div>
        <small class="aichat-settings-hint">快速添加当前页面到工作区</small>
      </div>
    </div>
  </div>
</div>

<div class="aichat-import-modal" id="aichat-import-modal" style="display:none">
  <div class="aichat-import-backdrop"></div>
  <div class="aichat-import-panel">
    <div class="aichat-import-header">
      <span class="aichat-import-title">导入文本并阻塞发送</span>
      <button class="aichat-import-close" id="aichat-import-close" type="button">×</button>
    </div>
    <div class="aichat-import-body">
      <div class="aichat-import-hint">粘贴文本，使用 <code>==========</code> 分隔多条消息，每段将创建一条阻塞消息，点击发送。</div>
      <textarea id="aichat-import-textarea" class="aichat-import-textarea" placeholder="第一条消息&#10;&#10;==========&#10;&#10;第二条消息&#10;&#10;==========&#10;&#10;第三条消息" rows="10"></textarea>
      <div class="aichat-import-count" id="aichat-import-count">将创建 0 条阻塞消息</div>
    </div>
    <div class="aichat-import-actions">
      <button class="aichat-import-cancel" id="aichat-import-cancel" type="button">取消</button>
      <button class="aichat-import-confirm" id="aichat-import-confirm" type="button">导入并阻塞</button>
    </div>
  </div>
</div>

<div class="tab-context-menu" id="tab-context-menu" style="display:none">
  <div class="context-menu-item" data-action="close">关闭标签页</div>
  <div class="context-menu-item danger" data-action="remove">移除工作区</div>
</div>

<div class="platform-pills" id="platform-pills">
  <div class="platform-pills-pages" id="page-pills"></div>
  <button class="page-tab-add" id="workspace-tab-add" title="添加当前页面到工作区">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="platform-panel" id="platform-panel">
  <div class="platform-panel-header">
    <span class="platform-panel-title">选择 AI 平台</span>
    <button class="platform-panel-select-all" id="panel-select-all" type="button">全选</button>
  </div>
  <div class="platform-options-row" id="platform-options-row"></div>
</div>

<div class="prompt-bar" id="prompt-bar">
  <span class="prompt-bar-label">提示词:</span>
  <span class="prompt-bar-name" id="prompt-bar-name"></span>
  <span class="prompt-bar-alias" id="prompt-bar-alias"></span>
  <button class="prompt-bar-edit" id="prompt-bar-edit" title="编辑当前提示词" style="display:none">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5l2 2-6 6-2.5.5.5-2.5 6-6z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="prompt-bar-clear" id="prompt-bar-clear" title="清除提示词">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</div>

<div class="main-pages">
  <section class="page active" id="page-main">
    <div class="response-content" id="response-content">
      <div class="history-section" id="history-section"></div>
      <div class="conversation-section" id="conversation-section">
        <div class="response-placeholder">暂无回复内容</div>
      </div>
    </div>
    <div class="response-status" id="response-status">
      <span class="status-indicator"></span>
      <span class="status-text">等待回复...</span>
    </div>
  </section>

  <section class="page" id="page-prompt-editor">
    <div class="prompt-editor-panel">
      <div class="prompt-editor-header">
        <span class="prompt-editor-title">编辑当前提示词</span>
        <span class="prompt-editor-path" id="prompt-editor-path"></span>
        <button class="prompt-editor-close" id="prompt-editor-close" type="button" title="关闭">×</button>
      </div>
      <div class="prompt-editor-body" id="prompt-editor-body">
        <!-- 由 promptEditor.js 渲染 -->
      </div>
    </div>
  </section>
</div>

<div class="input-area">
  <div class="extract-result" id="extract-result" style="display: none;">
    <div class="extract-result-header">
      <span class="extract-title" id="extract-title"></span>
      <button class="close-result" id="close-result" type="button">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="extract-url" id="extract-url"></div>
    <pre class="extract-content" id="extract-content"></pre>
  </div>

  <div class="chat-input-bar" id="chat-input-bar">
    <div class="pending-send-bar" id="pending-send-bar" style="display:none">
      <span class="pending-send-count" id="pending-send-count">0 条消息待发送</span>
      <button class="pending-send-btn" id="pending-send-btn">双链复制</button>
    </div>
    <div class="chat-input-inner">
      <div id="aichat-image-preview-area" class="image-preview-area" hidden></div>
      <textarea class="chat-input" id="chat-input" placeholder="输入消息，输入 / 选择提示词模板..." rows="2"></textarea>
    </div>
    <div class="chat-input-foot" id="chat-input-foot">
      <div class="chat-input-foot-left">
        <button class="foot-btn" id="foot-history-btn" title="查看历史消息">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.2"/><path d="M6 3.5v3l2 1.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          历史
        </button>
        <button class="foot-btn" id="foot-import-btn" title="导入文本并按 ========== 分隔阻塞">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 3h8M2 6h8M2 9h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          导入
        </button>
      </div>
      <div class="chat-input-foot-right">
        <button class="send-btn" id="chat-btn-send" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 8l12-6-6 12-2-4-4-2z" fill="currentColor" stroke="currentColor" stroke-width="0.5" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
