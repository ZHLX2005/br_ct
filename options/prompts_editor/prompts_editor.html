<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提示词编辑 - AI Assistant</title>
  <link rel="stylesheet" href="../options.css">
  <link rel="stylesheet" href="./prompts_editor.css">
</head>
<body>
  <div class="prompts-container page-container">
    <div class="prompts-header">
      <h2>提示词编辑器</h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <span id="connectionStatus" class="status-badge disconnected">未连接</span>
        <button class="btn" id="connectBtn">启动</button>
        <button class="btn" id="disconnectBtn" style="display: none;">关闭</button>
      </div>
    </div>

    <div class="prompts-layout">
      <div class="file-list-panel">
        <div class="file-list-header">
          <span>文件列表</span>
          <button id="refreshFiles" title="刷新">R</button>
        </div>
        <div class="file-list" id="fileList">
          <div class="loading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

      <div class="editor-panel">
        <div class="editor-toolbar">
          <span class="file-name" id="currentFileName">选择一个文件</span>
          <div class="actions">
            <button class="btn" id="addBtn">+ 添加</button>
          </div>
        </div>
        <div class="editor-content" id="editorContent">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
            <p>从左侧选择一个提示词文件进行编辑</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加弹窗 -->
  <div id="addModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>添加提示词</h3>
      <input type="text" id="promptLabel" placeholder="输入提示词名称">
      <input type="text" id="promptAlias" placeholder="输入别名（如 fix）用于 /fix 快捷触发">
      <textarea id="promptTemplate" placeholder="输入提示词内容"></textarea>
      <div class="modal-actions">
        <button class="btn" id="cancelAdd">取消</button>
        <button class="btn btn-primary" id="confirmAdd">添加</button>
      </div>
    </div>
  </div>

  <script type="module" src="../focusScroll/init.js"></script>
  <script src="./prompts_editor.js"></script>
</body>
</html>
