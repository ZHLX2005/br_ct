<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Options </title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="header-buttons">
            <button class="pin-btn" id="pin-btn" title="固定标签页">
              <span class="pin-icon"></span>
            </button>
            <button class="collapse-btn" id="sidebar-collapse-btn" title="收起侧边栏">
              <span class="collapse-icon">◀</span>
            </button>
            <button class="focus-btn" id="focus-btn" title="专注模式">
              <span class="focus-icon">◎</span>
            </button>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-item active" data-page="platform/index.html">
            <span class="nav-icon">PL</span>
            <span>平台显示</span>
          </div>
          <div class="nav-item" data-page="storage/index.html">
            <span class="nav-icon">DB</span>
            <span>存储管理</span>
          </div>
          <div class="nav-item" data-page="prompts_editor/prompts_editor.html">
            <span class="nav-icon">PR</span>
            <span>提示词编辑</span>
          </div>
          <div class="nav-item" data-page="local_cmd/index.html">
            <span class="nav-icon">CMD</span>
            <span>本地命令管理</span>
          </div>
        </nav>
        <div class="sidebar-footer">
          <p> options</p>
          <button
            class="quad-toggle-btn"
            id="quad-toggle-btn"
            type="button"
            title="显示或隐藏快捷切换按钮"
            aria-label="显示或隐藏快捷切换按钮"
            aria-pressed="true">
            <span class="quad-toggle-dot"></span>
            <span class="quad-toggle-dot"></span>
            <span class="quad-toggle-dot"></span>
            <span class="quad-toggle-dot"></span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <iframe id="content-frame" class="options-frame current-frame" src="platform/index.html" title="Options Content"></iframe>
        <iframe id="incoming-frame" class="options-frame incoming-frame" title="Options Snapshot" aria-hidden="true"></iframe>
      </main>
    </div>

    <script src="options.js"></script>

    <!-- Quad-dot launcher (bottom center) -->
    <button class="quad-launcher" id="quad-launcher" type="button" aria-label="切换菜单 (Ctrl+Alt+E)">
      <span class="quad-dot"></span>
      <span class="quad-dot"></span>
      <span class="quad-dot"></span>
      <span class="quad-dot"></span>
      <span class="quad-tooltip">Ctrl+Alt+E</span>
    </button>

    <!-- Win+Tab style switcher overlay -->
    <div class="switcher-overlay" id="switcher-overlay" hidden>
      <div class="switcher-backdrop" data-switcher-close></div>
      <div class="switcher-panel" role="dialog" aria-modal="true" aria-label="菜单切换">
        <div class="switcher-header">
          <div class="switcher-title">切换菜单</div>
          <div class="switcher-hint">Esc 关闭 · Enter 进入 · 方向键切换</div>
        </div>
        <div class="switcher-grid" id="switcher-grid" tabindex="-1"></div>
      </div>
    </div>

    <!-- 悬浮点导航 -->
    <div class="dot-nav" id="dot-nav">
      <div class="dot-nav-dots" id="dot-nav-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <div class="dot-nav-items" id="dot-nav-items">
        <!-- 导航项通过 JS 动态创建 -->
      </div>
    </div>
  </body>
</html>
