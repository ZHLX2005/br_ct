<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Right-Edge Nav — line 全程 + item hover 显示</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #0f1115;
    /* nav-item hover 时用深色 */
    --text-hover: #0f1115;
    /* nav-row idle 时用浅色 */
    --text-idle: rgba(15,17,21,0.55);
    --bubble-bg: #edf3fe;
    --border: rgba(15,17,21,0.06);
  }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }

  /* ============ 左侧：仿 DeepSeek 主对话区 ============ */
  .chat {
    padding: 56px 88px;
    display: flex; flex-direction: column;
    max-width: 920px;
  }
  .heading { font-size: 12px; color: rgba(15,17,21,0.5); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin-bottom: 12px; }
  .ds-virtual-list { display: flex; flex-direction: column; padding: 0; gap: 0; }
  .msg { display: flex; align-items: flex-end; padding: 0; margin: 0; }
  .msg--user { justify-content: flex-end; }
  .bubble { margin: 0 0 10px; }
  .msg--user .bubble {
    background: var(--bubble-bg); color: var(--text);
    padding: 10px 16px; border-radius: 22px;
    max-width: calc(100% - 88px); font-size: 16px; line-height: 24px;
  }

  /* ============ 右侧 nav 容器 ============ */
  .nav {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    /* idle: 完全透明、无视觉边框（border 用 1px transparent 占位避免 hover 抖动） */
    background: transparent;
    border: 1px solid transparent;
    border-radius: 0;
    box-shadow: 0 1px 2px transparent, 0 1px 3px transparent;
    /* 加大 padding（上下更宽） */
    padding: 16px 0;
    width: 28px;
    transition: width 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
    display: flex; flex-direction: column; align-items: flex-end;  /* 行内容右对齐 */
    /* 加大 row 之间的 gap */
    gap: 10px;
  }
  .nav:hover {
    width: max-content;
    max-width: 360px;
    /* hover 才显示容器（白底、圆角、弱阴影） */
    background: #fff;
    border-color: var(--border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15,17,21,0.06), 0 1px 3px rgba(15,17,21,0.1);
  }

  /* ============ 每行：display: flex，文字在前、line 在后（右边） ============ */
  .nav-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px 6px 14px;
    /* idle：继承统一浅色（让 hover 时颜色变化更明显） */
    color: rgba(15,17,21,0.55);
    transition: color 0.2s ease;
  }
  /* hover 行时加深文字（与 line 颜色加深同步） */
  .nav-row:hover { color: var(--text); }

  /* line：display: block，跟着 item 后面，margin-left: auto 推到 row 最右
     idle 时 item display: none，但 nav 自身 justify-content: flex-end 让所有 line 靠右 */
  .nav-line {
    display: block;
    width: 12px;             /* 未激活：12px（更短） */
    height: 4px;
    background: rgba(15,17,21,0.35);
    border-radius: 2px;
    flex-shrink: 0;
    transition: width 0.3s ease, background 0.3s ease;
  }
  /* active: 20px（更长一点） */
  .nav-line.is-active {
    width: 20px;
    background: rgba(0, 60, 179, 0.82);
  }
  /* hover 整列时 line 颜色加深（行 hover 触发，让 6 条 line 分别对应自己的 row 高亮） */
  .nav-row:hover .nav-line { background: rgba(15,17,21,0.7); }
  .nav-row:hover .nav-line.is-active { background: rgba(0, 50, 160, 0.95); }
  /* 兼容 nav 整体 hover（让单行加深的视觉一致） */
  .nav:hover .nav-line { background: rgba(15,17,21,0.7); }
  .nav:hover .nav-line.is-active { background: rgba(0, 50, 160, 0.95); }

  /* item：idle 时透明，hover 时 fade in + 右滑（容器展开后文字"凝结"在位置上） */
  .nav-item {
    font-size: 13px;
    line-height: 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 0;
    opacity: 0;
    transform: translateX(4px);
    transition: opacity 0.8s ease, transform 0.8s ease, max-width 0.8s ease;
  }
  .nav:hover .nav-item {
    max-width: 320px;
    opacity: 1;
    transform: translateX(0);
  }
</style>
</head>
<body>

  <main class="chat">
    <div class="heading">主对话 · ds-virtual-list</div>
    <div class="ds-virtual-list">
      <div class="msg msg--user"><div class="bubble">如何理解 Vite HMR 的文件监听机制？</div></div>
      <div class="msg msg--user"><div class="bubble">可以再讲一下为什么需要 chokidar 而不是 fs.watch？</div></div>
      <div class="msg msg--user"><div class="bubble">HMR fallback 处理逻辑是什么？</div></div>
      <div class="msg msg--user"><div class="bubble">预构建的依赖怎么参与 HMR？</div></div>
      <div class="msg msg--user"><div class="bubble">esbuild 在这里做了哪些事？</div></div>
      <div class="msg msg--user"><div class="bubble">ws 协议握手详细讲一下</div></div>
    </div>
  </main>

  <!-- 6 行 row，每行 line 在左、item 在右 -->
  <aside class="nav" id="nav">
    <div class="nav-row">
      <span class="nav-item">如何理解 Vite HMR 的文件监听机制？</span>
          <span class="nav-line is-active"></span>
    </div>
    <div class="nav-row">
      <span class="nav-item">可以再讲一下为什么需要 chokidar 而不是 fs.watch？</span>
            <span class="nav-line"></span>
    </div>
    <div class="nav-row">
      <span class="nav-item">HMR fallback 处理逻辑是什么？</span>
            <span class="nav-line"></span>
    </div>
    <div class="nav-row">
      <span class="nav-item">预构建的依赖怎么参与 HMR？</span>
            <span class="nav-line"></span>
    </div>
    <div class="nav-row">
      <span class="nav-item">esbuild 在这里做了哪些事？</span>
            <span class="nav-line"></span>
    </div>
    <div class="nav-row">
      <span class="nav-item">ws 协议握手详细讲一下</span>
            <span class="nav-line"></span>
    </div>
  </aside>

</body>
</html>
