<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>viewController tests</title>
<style>body{font-family:monospace;padding:12px} .pass{color:green} .fail{color:red;font-weight:bold}</style>
</head><body>
<h3>viewController tests</h3>
<div id="mount"></div>
<div id="out"></div>
<script type="module">
import { setMountPoint, register, mount, getCurrent } from './viewController.js';

const out = document.getElementById('out');
const log = (name, ok, detail='') => {
  const d = document.createElement('div'); d.className = ok ? 'pass' : 'fail';
  d.textContent = `${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`;
  out.appendChild(d);
};
const assert = (name, cond, detail) => log(name, !!cond, detail);
const hasLink = href => !!document.head.querySelector(`link[data-view-css="${href}"]`);

// 模拟恒留的 theme.css（静态 link，放 head 最前）
const theme = document.createElement('link');
theme.rel='stylesheet'; theme.href='theme.css'; theme.dataset.static='1';
document.head.insertBefore(theme, document.head.firstChild);
const hasTheme = () => !!document.head.querySelector('link[data-static="1"]');

// def 对象：init/onActivate/teardown 内 this===def，故 def.xxxCalls 可读
const viewA = { id:'a', cssHrefs:['a.css'], initCalls:0, onActivateCalls:0, teardownCalls:0,
  getBody: async () => '<body><div data-view-content><input id="a-input"></div></body>',
  init(el){ this.initCalls++; },
  onActivate(el){ this.onActivateCalls++; },
  teardown(el){ this.teardownCalls++; } };
const viewB = { id:'b', cssHrefs:['b.css'], initCalls:0, onActivateCalls:0, teardownCalls:0,
  getBody: async () => '<body><div data-view-content><p>b</p></div></body>',
  init(el){ this.initCalls++; },
  onActivate(el){ this.onActivateCalls++; },
  teardown(el){ this.teardownCalls++; } };
// viewC 故意不实现 onActivate，验证 backward-compat（缺省为 no-op，行为不变）
const viewC = { id:'c', cssHrefs:[], initCalls:0, teardownCalls:0,
  getBody: async () => '<body><div data-view-content><span id="c-span">c</span></div></body>',
  init(el){ this.initCalls++; },
  teardown(el){ this.teardownCalls++; } };

// viewM 模拟 main 的真实模式：onActivate 每次 mount 推一个 cleanup 到模块级共享数组；
// init 不再清零数组（旧实现下，init 后的 viewCleanups = [] 会把 onActivate 刚推入的 3 个
// cleanup 全抹掉，导致 teardown 跳过所有 document 监听 / alias popup 的清理 → 反复
// 挂载累积。移除 init 的清零后，每次 unmount 都应恰好清空当轮 push 的 cleanup）。
const viewM = { id:'m', cssHrefs:[], initCalls:0, onActivateCalls:0, teardownCalls:0,
  getBody: async () => '<body><div data-view-content><span id="m-span">m</span></div></body>',
  init(el){ this.initCalls++; /* 不再清零 viewMCleanups —— 修复点 */ },
  onActivate(el){ this.onActivateCalls++; viewMCleanups.push(() => { viewM.cleanupCount++; }); },
  teardown(el){ this.teardownCalls++; for (const c of viewMCleanups) c(); viewMCleanups = []; } };
let viewMCleanups = [];
Object.defineProperty(viewM, 'cleanupCount', { value: 0, writable: true });

setMountPoint(document.getElementById('mount'));
register([viewA, viewB, viewC, viewM]);

(async () => {
  await mount('a');
  assert('1 current===a', getCurrent()==='a');
  assert('1 a-input 在 DOM', !!document.getElementById('a-input'));
  assert('1 a.init 调 1 次', viewA.initCalls===1, `got ${viewA.initCalls}`);
  assert('1 a.onActivate 调 1 次', viewA.onActivateCalls===1, `got ${viewA.onActivateCalls}`);
  assert('1 a.css 在 head', hasLink('a.css'));
  assert('1 theme.css 恒在', hasTheme());

  document.getElementById('a-input').value = 'hello'; // 切走前写值

  await mount('a'); // 幂等
  assert('2 重复 mount(a) 幂等,init 不再调', viewA.initCalls===1, `got ${viewA.initCalls}`);
  assert('2 重复 mount(a) 幂等,onActivate 也不调', viewA.onActivateCalls===1, `got ${viewA.onActivateCalls}`);

  await mount('b');
  assert('3 current===b', getCurrent()==='b');
  assert('3 a-input 已从 mount 点移除', !document.getElementById('a-input'));
  assert('3 b.init 调 1 次', viewB.initCalls===1);
  assert('3 b.onActivate 调 1 次', viewB.onActivateCalls===1, `got ${viewB.onActivateCalls}`);
  assert('3 a.css 已移除', !hasLink('a.css'));
  assert('3 b.css 已加', hasLink('b.css'));
  assert('3 a.teardown 调 1 次', viewA.teardownCalls===1, `got ${viewA.teardownCalls}`);

  await mount('a'); // 切回
  assert('4 a 重新挂载', !!document.getElementById('a-input'));
  assert('4 a.init 不再调(ready)', viewA.initCalls===1, `got ${viewA.initCalls}`);
  // *** 核心断言：onActivate 在每次 mount 都调用 —— 这是修复的关键点 ***
  assert('4 a.onActivate 再次调用(每次 mount)', viewA.onActivateCalls===2, `got ${viewA.onActivateCalls}`);
  assert('4 a.teardown 已先于此次 onActivate 调用', viewA.teardownCalls===1);
  assert('4 b.teardown 调 1 次', viewB.teardownCalls===1);
  assert('4 b.onActivate 已调 1 次', viewB.onActivateCalls===1);

  await mount('b');
  assert('5 b.onActivate 再次调用', viewB.onActivateCalls===2, `got ${viewB.onActivateCalls}`);
  assert('5 a.onActivate 仍为 2（未再次 mount a）', viewA.onActivateCalls===2);
  assert('5 a.teardown 调 2 次（每次 unmount）', viewA.teardownCalls===2, `got ${viewA.teardownCalls}`);

  await mount('c'); // 验证无 onActivate 实现的视图：backward-compat
  assert('6 c 无 onActivate:viewC.onActivate 仍是 0', viewC.onActivateCalls===undefined || viewC.onActivateCalls===0);
  assert('6 c.init 调 1 次', viewC.initCalls===1);
  assert('6 c-span 在 DOM', !!document.getElementById('c-span'));
  assert('6 b.teardown 调 2 次（每次 unmount）', viewB.teardownCalls===2, `got ${viewB.teardownCalls}`);
  assert('6 c.teardown 未调（首挂）', viewC.teardownCalls===0);

  // 7 — 回归测试：模拟 main 的 viewCleanups 模式。onActivate 每次 mount push cleanup，
  // init 不再清零数组（修复前 init 会把当轮 onActivate 推入的 cleanup 全部抹掉 → teardown
  // 跳过所有清理 → 反复挂载累积监听/DOM）。预期：每次 unmount 恰好 fire 一次 cleanup。
  // 周期：mount m → mount a (m 卸载) → mount m (a 卸载) → mount a (m 卸载) → 应 fire 3 次。
  await mount('m');
  assert('7 m.span 在 DOM', !!document.getElementById('m-span'));
  assert('7 m.init 调 1 次', viewM.initCalls===1, `got ${viewM.initCalls}`);
  assert('7 m.onActivate 调 1 次', viewM.onActivateCalls===1, `got ${viewM.onActivateCalls}`);
  assert('7 m 初始 cleanupCount=0（未发生 unmount）', viewM.cleanupCount===0, `got ${viewM.cleanupCount}`);

  await mount('a'); // 切走 m → 应 fire 1 次 cleanup
  assert('7 mount a 后 m.span 已卸', !document.getElementById('m-span'));
  assert('7 m.onActivate 仍为 1（a 切换未触发 m 的 onActivate）', viewM.onActivateCalls===1, `got ${viewM.onActivateCalls}`);
  assert('7 m.teardown 调 1 次', viewM.teardownCalls===1, `got ${viewM.teardownCalls}`);
  assert('7 m.cleanupCount=1（首轮 unmount 触发 onActivate 注册的 cleanup）', viewM.cleanupCount===1, `got ${viewM.cleanupCount}`);

  await mount('m'); // 切回 m → 再 onActivate push 一次 cleanup
  assert('7 m.span 重新挂载', !!document.getElementById('m-span'));
  assert('7 m.onActivate 调 2 次(每次 mount)', viewM.onActivateCalls===2, `got ${viewM.onActivateCalls}`);
  assert('7 m.teardown 调 1 次（m 当前在挂）', viewM.teardownCalls===1);
  assert('7 m.cleanupCount 仍 1（mount 不应 fire cleanup）', viewM.cleanupCount===1, `got ${viewM.cleanupCount}`);

  await mount('a'); // 再切走 m → 应再 fire 1 次 cleanup（回归点：清零的 init 会让 cleanup 静默漏掉）
  assert('7 m.span 已卸', !document.getElementById('m-span'));
  assert('7 m.teardown 调 2 次', viewM.teardownCalls===2, `got ${viewM.teardownCalls}`);
  assert('7 m.cleanupCount=2（每轮 unmount 各 fire 1 次，无遗漏）', viewM.cleanupCount===2, `got ${viewM.cleanupCount}`);

  await mount('c'); // 再切走 a → m 不应被影响
  assert('7 m.cleanupCount 仍 2（未 unmount m）', viewM.cleanupCount===2, `got ${viewM.cleanupCount}`);

  await mount('m'); // 切回 m → 第三轮 onActivate
  assert('7 m.onActivate 调 3 次(每次 mount)', viewM.onActivateCalls===3, `got ${viewM.onActivateCalls}`);

  await mount('c'); // 再切走 m → 第三轮 cleanup
  assert('7 m.cleanupCount=3（三轮 unmount 各 fire 1 次）', viewM.cleanupCount===3, `got ${viewM.cleanupCount}`);
})();
</script>
</body></html>
