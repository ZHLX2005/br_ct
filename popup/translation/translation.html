<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>划词翻译设置</title>
  <link rel="stylesheet" href="../components/theme.css">
  <link rel="stylesheet" href="translation.css">
</head>
<body>
  <div class="translation-container" data-view-content>
    <div class="main-content">
      <!-- ========== 划词翻译区域 ========== -->
      <div class="setting-section">
        <div class="section-title">
          <span>划词翻译</span>
        </div>

        <!-- 模式选择 -->
        <div class="setting-item">
          <label class="setting-label">触发模式</label>
          <div class="radio-group">
            <label class="radio-item">
              <input type="radio" name="selectionMode" value="panel" id="modePanel" checked>
              <span>面板选择</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="selectionMode" value="auto" id="modeAuto">
              <span>自动翻译</span>
            </label>
            <label class="radio-item">
              <input type="radio" name="selectionMode" value="off" id="modeOff">
              <span>关闭</span>
            </label>
          </div>
          <small class="setting-hint">
            面板选择：划词后显示选项面板 | 自动翻译：划词后直接翻译
          </small>
        </div>

        <!-- 提示词模板（仅自动模式显示） -->
        <div id="promptSelectorContainer" class="setting-item">
          <label class="setting-label">快捷提示词</label>
          <select id="promptSelector" class="setting-select">
          </select>
        </div>

        <!-- 划词翻译选项 -->
        <div class="inline-options">
          <label class="checkbox-item">
            <input type="checkbox" id="selectionStreamToggle" class="toggle" checked>
            <span>流式输出</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="selectionThinkingToggle" class="toggle">
            <span>思考模式</span>
          </label>
        </div>
      </div>

      <!-- ========== OCR 识别区域 ========== -->
      <div class="setting-section">
        <div class="section-title">
          <span>OCR 识别</span>
        </div>

        <div class="setting-item">
          <label class="setting-label">识别提示词</label>
          <textarea
            id="ocrPromptInput"
            class="setting-textarea"
            placeholder="请输入 OCR 识别的提示词..."
            rows="2"
          >请识别图片中的所有文字内容</textarea>
        </div>

        <div class="inline-options">
          <label class="checkbox-item">
            <input type="checkbox" id="ocrStreamToggle" class="toggle">
            <span>流式输出</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="ocrThinkingToggle" class="toggle">
            <span>思考模式</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="ocrSilentModeToggle" class="toggle">
            <span>静默模式</span>
          </label>
        </div>

        <!-- 流速控制 -->
        <div id="flowRateControl" class="flow-rate-control" style="display: none; margin-top: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="setting-label" style="margin: 0;">输出速度</label>
            <span id="flowRateValue" class="flow-rate-value">中等</span>
          </div>
          <input
            type="range"
            id="flowRateSlider"
            class="flow-rate-slider"
            min="1"
            max="5"
            step="1"
            value="3"
          >
          <div style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: #6c757d;">
            <span>慢速</span>
            <span>较快</span>
          </div>
          <div id="flowRateWarning" class="flow-rate-warning" style="display: none;">
            输出速度较快可能导致页面卡顿
          </div>
        </div>

        <!-- OCR 快捷键 -->
        <div class="setting-item" style="margin-top: 12px;">
          <label class="setting-label">快捷键</label>
          <div class="shortcut-input-wrapper">
            <input
              type="text"
              id="ocrShortcutInput"
              class="shortcut-input"
              placeholder="点击设置快捷键..."
              readonly
            >
            <button id="clearOcrShortcutBtn" class="shortcut-clear-btn" title="清除快捷键">x</button>
          </div>
        </div>
      </div>

      <!-- ========== 统计信息区域 ========== -->
      <div class="setting-section">
        <div class="section-title">
          <span>统计信息</span>
        </div>

        <!-- 统计信息 -->
        <div class="stats-row">
          <div class="stat-item">
            <span class="stat-label">今日翻译：</span>
            <span id="todayCount" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">总计翻译：</span>
            <span id="totalCount" class="stat-value">0</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="translation.js" type="module"></script>
</body>
</html>
